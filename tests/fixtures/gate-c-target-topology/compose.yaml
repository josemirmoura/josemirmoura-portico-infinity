name: portico-gate-c-isolated-20261011
services:
  lab-certificates:
    image: python:3.12-bookworm
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        cd /pki
        command -v openssl
        if [ ! -s ca.pem ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 1 -subj '/CN=Portico Gate C Test CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=idp.gate-c.test' -addext 'subjectAltName=DNS:idp.gate-c.test' >/dev/null 2>&1
          printf 'subjectAltName=DNS:idp.gate-c.test\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          chmod 644 ca.pem server.pem
          chmod 600 ca.key server.key
        fi
        test -s ca.pem && test -s server.pem && test -s server.key
        printf 'LAB_CERT_GENERATION_OK\n'
    volumes:
      - test-certificates:/pki
    networks: [laboratory]
    mem_limit: 256m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  lab-idp:
    image: python:3.12-slim-bookworm
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python3 -u - <<'PY'
        from http.server import BaseHTTPRequestHandler, HTTPServer
        import base64, json
        expected = 'Basic ' + base64.b64encode(b'fixture-client:fixture-password').decode('ascii')
        class Stub(BaseHTTPRequestHandler):
            def do_POST(self):
                if self.path != '/oauth/v2/introspect':
                    self.send_error(404)
                    return
                if self.headers.get('Authorization') != expected:
                    self.send_response(401)
                    self.send_header('WWW-Authenticate', 'Basic realm="fixture"')
                    self.end_headers()
                    return
                payload = json.dumps({'active':False}).encode()
                self.send_response(200)
                self.send_header('Content-Type','application/json')
                self.send_header('Content-Length',str(len(payload)))
                self.end_headers()
                self.wfile.write(payload)
            def log_message(self, *args): pass
        HTTPServer(('0.0.0.0', 8080), Stub).serve_forever()
        PY
    networks: [laboratory]
    mem_limit: 128m
    pids_limit: 48
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  lab-traefik:
    image: traefik:v3.6
    depends_on:
      lab-certificates:
        condition: service_completed_successfully
      lab-idp:
        condition: service_started
    command:
      - "--entrypoints.secure.address=:8443"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--api.dashboard=false"
      - "--log.level=ERROR"
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - test-certificates:/pki:ro
    networks:
      laboratory:
        aliases: ["idp.gate-c.test"]
    mem_limit: 192m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  lab-https-probe:
    image: python:3.12-slim-bookworm
    depends_on:
      lab-traefik:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python3 -u - <<'PY'
        import base64, json, ssl, time, urllib.request, urllib.error
        url = 'https://idp.gate-c.test:8443/oauth/v2/introspect'
        auth = 'Basic '+base64.b64encode(b'fixture-client:fixture-password').decode('ascii')
        context = ssl.create_default_context(cafile='/pki/ca.pem')
        class DenyRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args): return None
        opener = urllib.request.build_opener(urllib.request.HTTPSHandler(context=context), DenyRedirect(), urllib.request.ProxyHandler({}))
        for i in range(35):
            try:
                req=urllib.request.Request(url, data=b'token=deliberately-invalid-lab-token', headers={'Authorization':auth, 'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
                with opener.open(req,timeout=3) as resp:
                    assert resp.status==200, resp.status
                    assert json.load(resp)=={'active':False}
                break
            except (OSError,urllib.error.URLError):
                if i==34: raise
                time.sleep(1)
        print('PASS: valid in-network HTTPS/CA+hostname, invalid token active=false')
        try:
            bad=urllib.request.Request(url,data=b'token=invalid',headers={'Authorization':'Basic invalid'},method='POST')
            opener.open(bad,timeout=5)
            raise AssertionError('invalid client secret unexpectedly accepted')
        except urllib.error.HTTPError as e:
            assert e.code==401,e.code
        print('PASS: bad OAuth client credentials rejected 401')
        no_trust=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl.create_default_context()),urllib.request.ProxyHandler({}))
        try:
            no_trust.open(urllib.request.Request(url,data=b'token=invalid',method='POST'),timeout=5)
            raise AssertionError('untrusted CA unexpectedly accepted')
        except (ssl.SSLError,urllib.error.URLError): pass
        print('PASS: untrusted CA fails closed')
        wrong_host='https://lab-traefik:8443/oauth/v2/introspect'
        try:
            opener.open(urllib.request.Request(wrong_host,data=b'token=invalid',method='POST'),timeout=5)
            raise AssertionError('hostname mismatch unexpectedly accepted')
        except (ssl.SSLError,urllib.error.URLError): pass
        print('PASS: hostname mismatch fails closed')
        print('LAB_GATE_C_TRAEFIK_OAUTH_TLS_OK')
        PY
    volumes:
      - test-certificates:/pki:ro
    networks: [laboratory]
    mem_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
networks:
  laboratory:
    internal: true
volumes:
  test-certificates:
