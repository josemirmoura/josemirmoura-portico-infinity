name: lifecycle-acceptance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare explicit scoped root
        run: |
          sudo rm -rf /opt/my-app /opt/vps-agent-lifecycle-scope
          sudo install -d -o "$USER" -g "$USER" -m 0750 /opt/vps-agent-lifecycle-scope

      - name: Missing default scope fails before Docker
        run: |
          if bash scripts/init.sh > /tmp/bootstrap-missing-scope.txt 2>&1; then
            echo "bootstrap unexpectedly accepted a missing default scope" >&2
            exit 1
          fi
          grep -q 'VPS_AGENT_SCOPE_ROOT does not exist: /opt/my-app' /tmp/bootstrap-missing-scope.txt
          test -f .env
          test -f config/policy.yaml

      - name: Bootstrap explicit scope and migrate template policy
        run: |
          bash scripts/init.sh --scope /opt/vps-agent-lifecycle-scope
          grep -q '^VPS_AGENT_SCOPE_ROOT=/opt/vps-agent-lifecycle-scope$' .env
          grep -q '/opt/vps-agent-lifecycle-scope' config/policy.yaml
          ! grep -q '/opt/my-app' config/policy.yaml
          ! grep -q 'CHANGE_ME_' .env

      - name: Start and verify stock package
        run: |
          docker compose up -d --build
          bash scripts/verify.sh

      - name: Diagnostic bundle is redacted
        shell: bash
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          admin="$VPS_AGENT_ADMIN_TOKEN"
          static="$VPS_AGENT_STATIC_TOKEN"
          bash scripts/diagnose.sh bundle /tmp/vps-agent-diagnostic.tar.gz
          mkdir /tmp/diagnostic
          tar -xzf /tmp/vps-agent-diagnostic.tar.gz -C /tmp/diagnostic
          ! grep -R -F "$admin" /tmp/diagnostic
          ! grep -R -F "$static" /tmp/diagnostic

      - name: Successful update preserves state and policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name lifecycle-ci
          git config user.email lifecycle-ci@example.invalid
          base="$(git rev-parse HEAD)"
          cp config/policy.yaml /tmp/policy.before
          cp state/state.db /tmp/state.before

          git switch -c lifecycle-current "$base"
          git switch -c lifecycle-good-target
          printf 'lifecycle update target\n' > .lifecycle-update-marker
          git add .lifecycle-update-marker
          git commit -m 'test: lifecycle good update target'
          good="$(git rev-parse HEAD)"
          fixture_dir="/tmp/portico-lifecycle-release-${GITHUB_RUN_ID}"
          mkdir -p "$fixture_dir"
          git init --bare -q "$fixture_dir/origin.git"
          git remote set-url origin "$fixture_dir/origin.git"
          git tag v0.1.0-rc.7 "$good"
          git push -q origin "refs/tags/v0.1.0-rc.7"
          python3 tests/scripts/setup_published_release_fixture.py \
            --root "$fixture_dir" --repo "$PWD" --tag v0.1.0-rc.7 --commit "$good"
          git switch lifecycle-current

          PORTICO_FIXTURE_ROOT="$fixture_dir" \
            VPS_AGENT_UPDATE_REF=v0.1.0-rc.7 \
            PATH="$fixture_dir/fakebin:$PATH" bash scripts/update.sh
          test "$(git rev-parse HEAD)" = "$good"
          cmp /tmp/policy.before config/policy.yaml
          docker compose exec -T broker /usr/local/bin/vps-agent audit-status >/tmp/audit.after-update.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/audit.after-update.json'))
          assert x['ok'] is True and x['result']['valid'] is True, x
          PY

      - name: Failed update rolls back code and state
        shell: bash
        run: |
          set -euo pipefail
          good="$(git rev-parse HEAD)"
          git switch -c lifecycle-bad-target
          printf 'THIS IS NOT A DOCKERFILE\n' > Dockerfile
          printf '0.1.0-rc.8\n' > VERSION
          git add Dockerfile VERSION
          git commit -m 'test: lifecycle broken update target'
          bad="$(git rev-parse HEAD)"
          fixture_dir="/tmp/portico-lifecycle-release-${GITHUB_RUN_ID}"
          git tag v0.1.0-rc.8 "$bad"
          git push -q origin "refs/tags/v0.1.0-rc.8"
          python3 tests/scripts/setup_published_release_fixture.py \
            --root "$fixture_dir" --repo "$PWD" --tag v0.1.0-rc.8 --commit "$bad"
          git switch lifecycle-current
          test "$(git rev-parse HEAD)" = "$good"

          if PORTICO_FIXTURE_ROOT="$fixture_dir" \
             PATH="$fixture_dir/fakebin:$PATH" \
             VPS_AGENT_UPDATE_REF=v0.1.0-rc.8 bash scripts/update.sh; then
            echo 'broken update unexpectedly succeeded' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$good"
          cmp /tmp/policy.before config/policy.yaml
          bash scripts/verify.sh

      - name: Safe remove preserves operator state
        run: |
          bash scripts/remove.sh safe
          test -f .env
          test -f config/policy.yaml
          test -f state/state.db
          test -z "$(docker ps -q --filter label=com.docker.compose.project=mcp-vps-agent)"

      - name: Reinstall after safe remove
        run: |
          docker compose up -d --build
          bash scripts/verify.sh

      - name: Full purge removes MCP-owned state, images and empty legacy sandbox
        run: |
          sudo install -d -m 0755 /opt/vps-agent-sandbox
          VPS_AGENT_PURGE_CONFIRM=PURGE bash scripts/remove.sh --purge
          test ! -e .env
          test ! -e config/policy.yaml
          test ! -e state
          test -d /opt/vps-agent-lifecycle-scope
          test ! -d /opt/vps-agent-sandbox
          ! docker image inspect mcp-vps-agent-gateway:local >/dev/null 2>&1
          ! docker image inspect mcp-vps-agent-broker:local >/dev/null 2>&1

      - name: Reject orphaned identity resources after full purge
        shell: bash
        run: |
          set -euo pipefail
          # Dedicated GitHub runner only. No production Docker host or credentials.
          test ! -e .env
          test ! -e config/policy.yaml
          orphan="mcp-vps-agent_zitadel-bootstrap"
          docker volume create "$orphan" >/dev/null
          trap 'docker volume rm "$orphan" >/dev/null 2>&1 || true' EXIT
          if VPS_AGENT_PURGE_CONFIRM=PURGE bash scripts/remove.sh --purge \
             > "$RUNNER_TEMP/orphan-purge.txt" 2>&1; then
            echo 'Unexpectedly purged resources without owning Compose containers' >&2
            exit 1
          fi
          grep -q 'manual ownership verification required' "$RUNNER_TEMP/orphan-purge.txt"
          docker volume inspect "$orphan" >/dev/null
          test ! -e .env
          docker volume rm "$orphan" >/dev/null
          trap - EXIT

      - name: Reinstall from fully purged state and validate fresh audit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/init.sh --scope /opt/vps-agent-lifecycle-scope
          test -f .env
          test -f config/policy.yaml
          docker compose up -d --build
          bash scripts/verify.sh
          docker compose exec -T broker /usr/local/bin/vps-agent audit-status \
            > "$RUNNER_TEMP/audit.after-clean-reinstall.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"audit.after-clean-reinstall.json"
          result=json.loads(p.read_text())
          assert result["ok"] is True and result["result"]["valid"] is True, result
          PY

      - name: Final purge is clean and does not delete scoped workloads
        shell: bash
        run: |
          set -euo pipefail
          VPS_AGENT_PURGE_CONFIRM=PURGE bash scripts/remove.sh --purge
          test ! -e .env
          test ! -e config/policy.yaml
          test ! -e state
          test -d /opt/vps-agent-lifecycle-scope
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=mcp-vps-agent)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=mcp-vps-agent)"

      - name: Save isolated E2E evidence with explicit synthetic-release caveat
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/portico-lifecycle-evidence"
          install -d -m 0700 "$evidence"
          python3 - "$evidence/result.json" <<'PY'
          import datetime, json, os, pathlib, sys
          evidence={
              "runner": "GitHub-hosted disposable ubuntu-24.04",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "recorded_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "checks": ["install", "verify", "synthetic_release_update",
                         "failed_update_rollback", "safe_remove", "reinstall",
                         "full_purge", "orphan_purge_denial", "fresh_reinstall",
                         "audit_integrity", "final_purge"],
              "release_provenance": "FAKE TEST FIXTURE ONLY",
              "production_release_signature_verified": False,
              "real_zitadel_and_chatgpt_acceptance": False,
              "gate_c_approved": False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(evidence, indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gate-c-disposable-lifecycle-evidence
          path: ${{ runner.temp }}/portico-lifecycle-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          sudo rm -rf /opt/my-app /opt/vps-agent-lifecycle-scope

  guided-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run guided Standard installation to local checkpoint in PT-BR
        shell: bash
        run: |
          set -euo pipefail
          bash -c 'source scripts/lib/product.sh; unset VPS_AGENT_LANG LC_ALL LC_MESSAGES; LANG=pt_BR.UTF-8; vps_agent_init_language ""; test "$VPS_AGENT_LANG" = "pt-BR"'
          bash -c 'source scripts/lib/product.sh; unset VPS_AGENT_LANG LC_ALL LC_MESSAGES; LANG=en_US.UTF-8; vps_agent_init_language ""; test "$VPS_AGENT_LANG" = "en"'
          bash scripts/install.sh \
            --lang pt-BR \
            --profile custom \
            --scope /opt \
            --local-only \
            --yes | tee /tmp/guided-install.txt
          grep -q 'Portico MCP' /tmp/guided-install.txt
          grep -Fq 'Made by Josemir Moura | github.com/josemirmoura' /tmp/guided-install.txt
          grep -q 'CHECKPOINT LOCAL CONCLUÍDO' /tmp/guided-install.txt
          grep -q 'A instalação NÃO está concluída' /tmp/guided-install.txt
          grep -q '^VPS_AGENT_SCOPE_ROOT=/opt$' .env
          grep -q '^  read: \[\]$' config/policy.yaml
          grep -q '^  write: \[\]$' config/policy.yaml
          grep -q '^  cwd_roots: \[\]$' config/policy.yaml
          grep -q "^  run_as: $(id -un)$" config/policy.yaml
          test -f state/state.db
          bash scripts/diagnose.sh status | tee /tmp/guided-status.txt
          grep -q 'Portico MCP' /tmp/guided-status.txt
          python3 scripts/authority-summary.py | tee /tmp/guided-authority.txt
          grep -q 'Resumo da autoridade efetiva' /tmp/guided-authority.txt
          grep -q 'Montagem de host inteiro: não' /tmp/guided-authority.txt
          grep -q 'Raízes de leitura do filesystem:' /tmp/guided-authority.txt
          grep -q '  - nenhuma' /tmp/guided-authority.txt
          ! grep -q 'Effective authority summary' /tmp/guided-authority.txt
          ! grep -q 'Filesystem read roots' /tmp/guided-authority.txt
          ! grep -q '  - none' /tmp/guided-authority.txt

      - name: Safe remove after guided installation
        run: |
          bash scripts/remove.sh safe
          test -f .env
          test -f config/policy.yaml
          test -f state/state.db
          test -z "$(docker ps -q --filter label=com.docker.compose.project=mcp-vps-agent)"

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true

