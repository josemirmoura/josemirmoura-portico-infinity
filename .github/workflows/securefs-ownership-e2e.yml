name: securefs-ownership-e2e

on:
  pull_request:
    paths:
      - "internal/securefs/securefs.go"
      - "internal/securefs/securefs_test.go"
      - ".github/workflows/securefs-ownership-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    name: Owner mapping and symlink safety in disposable Linux filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unprivileged contract and symlink/scope regressions
        run: |
          set -euo pipefail
          go test -count=1 ./internal/securefs
      - name: Privileged Broker analog with root process and unprivileged directory owner
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GOCACHE=$RUNNER_TEMP/portico-root-go-cache" \
            "$(command -v go)" test -count=1 -v ./internal/securefs -run 'TestAtomicWrite(HostOwner|PreservesExistingDifferentOwner|SymlinkTargetRefusedWithoutReplacement|OwnerPreservesForeignRootBoundary)$'
      - name: Privileged directory ownership does not affect runner files
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -d internal/securefs
          git status --porcelain
