name: mcp-community-production-profile-evidence

on:
  pull_request:
    paths:
      - '.github/workflows/mcp-community-profile-gate.yml'
      - 'scripts/mcp_community_profile_probe.py'
      - 'tests/scripts/test_mcp_community_profile_probe.py'
      - 'tests/scripts/test_mcp_gate_c_audit_inventory.py'
      - 'tests/scripts/test_mcp_gate_c_normative_controls.py'
      - 'docs/mcp-gate-c-audit-20261011.md'
      - 'docs/mcp-gate-c-normative-controls.json'
      - 'docs/mcp-gate-c-normative-acceptance.md'
      - 'internal/gateway/**'
      - 'internal/broker/**'
      - 'internal/ipc/**'
      - 'tests/integration/**'
      - 'cmd/vps-agent-gateway/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normal-distributed-gateway-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fail-closed verifier negative regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/scripts -p 'test_mcp_community_profile_probe.py' -v
          python3 -m unittest discover -s tests/scripts -p 'test_mcp_gate_c_audit_inventory.py' -v
          python3 -m unittest discover -s tests/scripts -p 'test_mcp_gate_c_normative_controls.py' -v
          python3 -m py_compile scripts/mcp_community_profile_probe.py
      - name: Build normal Gateway binary WITHOUT conformance fixture build tags
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/portico-real-distributed-gateway" ./cmd/vps-agent-gateway
      - name: Test actual MCP wire, catalog, and HTTP security on disposable loopback
        env:
          VPS_AGENT_AUTH_MODE: none
          VPS_AGENT_LISTEN: 127.0.0.1:18997
        run: |
          set -euo pipefail
          mkdir -p evidence
          export VPS_AGENT_POC_ROOT="$RUNNER_TEMP/portico-profile-safe-root"
          "$RUNNER_TEMP/portico-real-distributed-gateway" > "$RUNNER_TEMP/profile-gateway.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18997/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          if [ "$ready" != 1 ]; then
            echo 'Disposable normal Gateway failed startup' >&2
            exit 1
          fi
          python3 scripts/mcp_community_profile_probe.py \
            --url http://127.0.0.1:18997/mcp \
            --output evidence/community-profile-http.json
      - name: Verify real OAuth resource-server and Scoped Broker tests (not fake tooling)
        shell: bash
        env:
          GATE_C_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          go test -race -count=1 -json ./internal/gateway ./tests/integration > evidence/go-protocol-tests.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          required = {
              'TestIntegratedOAuthResourceServerBoundaryE2E',
              'TestMCPCompletionCapabilityIsAbsentAndMethodIsClosed',
              'TestProductionMCPServerDoesNotExposeConformanceFixtures',
              'TestGateCStatelessHTTPRejectsHeaderSpoofingBeforeExecutor',
              'TestGateCOriginAuthorityPreventsDNSRebinding',
              'TestGateCOriginCanonicalDefaultPortsAtRealHTTPGateway',
              # Independent audit A1--A5: no fixture catalog, test actual
              # Gateway and OAuth verifier under Go -race.
              'TestGateCA1IntrospectionRedirectNeverForwardsCredentials',
              'TestGateCA1InsecureIntrospectionConfigurationFailsClosed',
              'TestGateCA1TLSCertificateVerificationCannotBeBypassed',
              'TestGateCA1TrustAnchoredTLSRoundTrip',
              'TestGateCA2MCPEncodedNameAgainstRealHandler',
              'TestGateCA3UnknownHistoricalVersionHasStructuredErrorAndID',
              'TestGateCA4RateLimitHTTPRealGatewayAndNonToolsUnaffected',
              'TestGateCA5DuplicateMCPHeadersRejectedInBothOrders',
              'TestGateCOAuthStatelessRealBrokerFailClosed',
              # Real OAuth -> persistent external approval -> Broker policy,
              # including deny and revoke, uses only disposable fixtures.
              'TestOAuthExternalApprovalRealBrokerRoundTrip',
              'TestGateCVerifiedHTTPSIntrospectionToBroker',
              'TestGateCRealProductionToolCatalogSchemas202012',
              'TestGateCRealGatewayDoesNotAdvertiseDeprecatedUnusedLogging',
              'TestGateCRealHandlerRequestContextPropagatesDisconnect',
              'TestGateCRealHTTPMalformedJSONRPCNeverReachesExecutor',
          }
          events = [json.loads(line) for line in Path('evidence/go-protocol-tests.jsonl').read_text().splitlines() if line.strip()]
          passed = {e['Test'] for e in events if e.get('Action') == 'pass' and e.get('Test')}
          failed = [e.get('Test') or e.get('Package') for e in events if e.get('Action') == 'fail']
          skipped = {e['Test'] for e in events if e.get('Action') == 'skip' and e.get('Test') in required}
          missing = sorted(required - passed)
          if missing or failed or skipped:
              raise SystemExit(f'Gate C actual boundary failure: missing={missing} failed={failed} skipped={sorted(skipped)}')
          summary = {
              'source_sha': os.environ['GATE_C_SOURCE_SHA'],
              'required_real_gateway_test_names': sorted(required),
              'all_required_tests_passed': True,
              'full_frozen_37_scenario_gate_passed': False,
              'real_client_and_operator_acceptance_passed': False,
              'release_gate_c_approved': False,
              'note': 'Subset production profile evidence; official frozen suite is evaluated independently.'
          }
          Path('evidence/community-profile-oauth-broker.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('Real Gateway OAuth/Broker:', len(required), 'required tests PASS (not release certification)')
          PY
      - name: Preserve only structured redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-real-mcp-profile-${{ github.run_id }}
          path: |
            evidence/community-profile-http.json
            evidence/community-profile-oauth-broker.json
          if-no-files-found: warn
          retention-days: 30
